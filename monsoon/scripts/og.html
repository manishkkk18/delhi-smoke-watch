<!doctype html>
<!-- Share image (1200x630). Render: see make_og.sh. Figures are IMD's official 2026 numbers. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Source+Sans+3:wght@500;600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f6f1e7; color: #1b2832; font-family: "Source Sans 3", sans-serif; position: relative; }
  .pad { position: absolute; inset: 56px 64px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px; }
  .kicker { font: 600 20px/1 "Source Sans 3"; letter-spacing: .14em; text-transform: uppercase; color: #8a4f15; }
  h1 { font: 700 60px/1.02 Fraunces, serif; margin: 18px 0 0; letter-spacing: -.01em; }
  .big { font: 800 178px/.85 Fraunces, serif; color: #8a4f15; letter-spacing: -.05em; margin-top: 40px; }
  .cap { font: 500 27px/1.2 Fraunces, serif; margin-top: 12px; }
  .q { font: italic 500 30px/1.2 Fraunces, serif; color: #14507a; position: absolute; left: 64px; bottom: 44px; }
  .months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: end; height: 380px; margin-top: 70px; }
  .m { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; text-align: center; }
  .bar { position: relative; height: 300px; border-bottom: 2px solid #1b2832; }
  .bar i { position: absolute; bottom: 0; left: 14%; right: 14%; border-radius: 6px 6px 0 0; }
  .bar b { position: absolute; left: 0; right: 0; border-top: 2px dashed #44525d; }
  .v { font: 600 26px/1 "Source Sans 3"; margin-bottom: 8px; }
  .n { font: 500 20px/1 "Source Sans 3"; color: #44525d; margin-top: 10px; }
  .strip { position: absolute; right: 64px; bottom: 50px; display: flex; gap: 0; border-radius: 4px; overflow: hidden; }
  .strip i { width: 46px; height: 16px; }
</style></head>
<body>
  <div class="pad">
    <div>
      <div class="kicker">Monsoon 2026 · a season in retrospect</div>
      <h1>The Monsoon, District by District</h1>
      <div class="big">87%</div>
      <div class="cap">of its normal monsoon rain fell on India</div>
    </div>
    <div class="months">
      <div class="m"><div class="v">65%</div><div class="bar"><b style="bottom:76.9%"></b><i style="height:50%;background:#e0a640"></i></div><div class="n">June</div></div>
      <div class="m"><div class="v">101%</div><div class="bar"><b style="bottom:76.9%"></b><i style="height:77.7%;background:#e6e0d2;outline:1px solid #a39b8b"></i></div><div class="n">July</div></div>
      <div class="m"><div class="v">84%</div><div class="bar"><b style="bottom:76.9%"></b><i style="height:64.6%;background:#e6e0d2;outline:1px solid #a39b8b"></i></div><div class="n">August</div></div>
      <div class="m"><div class="v">92%</div><div class="bar"><b style="bottom:76.9%"></b><i style="height:70.8%;background:#e6e0d2;outline:1px solid #a39b8b"></i></div><div class="n">September</div></div>
    </div>
  </div>
  <div class="q">Did it show up for your district?</div>
  <div class="strip"><i style="background:#3b220d"></i><i style="background:#93561d"></i><i style="background:#e0a640"></i><i style="background:#e6e0d2"></i><i style="background:#4aa8b0"></i><i style="background:#14507a"></i></div>
</body></html>
